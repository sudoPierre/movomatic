[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "movomatic"
version = "1.0.0"
description = "Instagram Reel ➜ Gemini ➜ Jellyseerr: request a movie or series straight from the iOS share sheet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pierre Galliot" }]
keywords = ["jellyseerr", "gemini", "instagram", "yt-dlp", "radarr", "sonarr", "selfhosted"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    # Instagram changes often: update with `deploy/install_lxc.sh --update`.
    "yt-dlp==2026.10.21",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
]

[project.scripts]
movomatic = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
